# Builds pump BOARD for Apple silicon on every push to main and publishes the app as the "latest" release,
# so there is always a build to download and try. Unsigned: first launch needs right-click > Open (see README).
# Pull requests build and test the app but never publish it.
name: Mac build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the publish job needs a write token; the build and plugin jobs, and so everything a pull request runs, see
# read only (CodeRabbit, PR #2).
permissions:
  contents: read

concurrency:
  # Per ref, so a pull request cannot cancel a release build of main.
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # JUCE and pump only; pump's own nested submodules are not needed
          fetch-depth: 1

      - name: Tools
        run: brew install ninja || true

      - name: Configure (Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build app and tests
        run: |
          set -o pipefail
          cmake --build build --target PumpBoard PumpBoardTests 2>&1 | tee build.log || {
            # Annotations are readable through the API even where the logs are not: send the errors there.
            # Linker output does not say "error:" on the line that names the symbol, so the pattern covers the
            # shapes clang and ld actually print. Annotations are readable through the API where logs are not.
            grep -E "error:|Undefined symbols|referenced from|duplicate symbol|^ld: |Error|FAILED" build.log | head -20 | while IFS= read -r line; do echo "::error title=build::${line}"; done
            exit 1; }

      - name: Run tests
        run: |
          set -o pipefail                     # a failing suite must fail the build, not hide behind tail
          report() { grep -E "!!!|FAILED|failed" tests.log | head -15 | while IFS= read -r line; do echo "::error title=tests::${line}"; done; tail -40 tests.log; }
          ./build/PumpBoardTests_artefacts/Release/PumpBoardTests > tests.log 2>&1 || { report; exit 1; }
          tail -3 tests.log
          grep -q " 0 failed" tests.log || { report; exit 1; }

      - name: Package
        run: |
          cd "build/PumpBoard_artefacts/Release"
          ditto -c -k --sequesterRsrc --keepParent "pump BOARD.app" "$GITHUB_WORKSPACE/pump-BOARD-mac-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pump-BOARD-mac-arm64
          path: pump-BOARD-mac-arm64.zip

  # Publishing is the only thing that needs a write token, so it is its own job. Keeping it out of the build job is
  # what lets every pull request run with contents: read.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pump-BOARD-mac-arm64

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pump-BOARD-mac-arm64.zip \
            --title "Latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA} on Apple silicon (Release). Unsigned: right-click > Open the first time." \
            --target "$GITHUB_SHA"

  # Card 8.1: the plugin target is verified where it can actually be built. A separate job, so a plugin failure
  # can never stop the app's release and "additional software" stays additional.
  plugin:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Tools
        run: brew install ninja || true

      - name: Configure (Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build both formats
        run: |
          set -o pipefail
          cmake --build build --target PumpBoardPlugin_VST3 PumpBoardPlugin_AU 2>&1 | tee plugin.log || {
            grep -E "error:|Undefined symbols|referenced from|duplicate symbol|^ld: |Error|FAILED" plugin.log | head -20 | while IFS= read -r line; do echo "::error title=plugin build::${line}"; done
            exit 1; }
          # Do not trust the artefact layout: find what the build actually produced.
          for kind in "pump BOARD.vst3" "pump BOARD.component"; do
            found=$(find build/PumpBoardPlugin_artefacts -maxdepth 4 -name "$kind" | head -1)
            test -n "$found" || { echo "::error title=plugin build::no $kind was produced"; exit 1; }
            echo "built $found"
          done

      - name: Validate the AU
        run: |
          set -o pipefail
          COMPONENT=$(find build/PumpBoardPlugin_artefacts -maxdepth 4 -name "pump BOARD.component" | head -1)
          COMPONENTS="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$COMPONENTS"
          rm -rf "$COMPONENTS/pump BOARD.component"
          cp -R "$COMPONENT" "$COMPONENTS/"
          # An ad-hoc signature is enough for the out-of-process AU host to load it here; distribution signing,
          # notarisation and the VST3 validator are card 8.9.
          codesign --force --sign - "$COMPONENTS/pump BOARD.component"
          # aumf: AU_MAIN_TYPE is a MusicEffect. Subtype and manufacturer are the plugin codes in CMakeLists.txt.
          auval -v aumf Pb01 Wake 2>&1 | tee auval.log || {
            grep -E "FAILED|ERROR|Error|error" auval.log | head -15 | while IFS= read -r line; do echo "::error title=auval::${line}"; done
            tail -40 auval.log
            exit 1; }
