<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- pump BOARD app icon: one compact pedal, Thunder Plus IDM PINK & GREEN.
       Paper #E9E8E3, ink #141414, pink #FF2D8A, green #1F9E5A. Flat, square-ish, heavy ink lines. -->
  <defs>
    <style>
      .ink { stroke: #141414; stroke-linejoin: round; stroke-linecap: round; }
      text { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    </style>
  </defs>

  <!-- tile (macOS grid: 824 px inside a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#E9E8E3" class="ink" stroke-width="14"/>

  <!-- jacks -->
  <rect x="246" y="308" width="52" height="64" rx="8" fill="#141414"/>
  <rect x="726" y="308" width="52" height="64" rx="8" fill="#141414"/>

  <!-- body -->
  <rect x="288" y="176" width="448" height="676" rx="40" fill="#FF2D8A" class="ink" stroke-width="18"/>

  <!-- knobs -->
  <g class="ink" stroke-width="13">
    <circle cx="380" cy="268" r="46" fill="#E9E8E3"/>
    <line x1="380" y1="268" x2="352" y2="238"/>
    <circle cx="512" cy="268" r="46" fill="#E9E8E3"/>
    <line x1="512" y1="268" x2="512" y2="228"/>
    <circle cx="644" cy="268" r="46" fill="#E9E8E3"/>
    <line x1="644" y1="268" x2="672" y2="238"/>
  </g>

  <!-- check LED -->
  <circle cx="512" cy="362" r="17" fill="#1F9E5A" class="ink" stroke-width="9"/>

  <!-- the pedal plate -->
  <rect x="314" y="400" width="396" height="424" rx="24" fill="#FF2D8A" class="ink" stroke-width="15"/>

  <!-- label window -->
  <rect x="350" y="434" width="324" height="150" rx="10" fill="#E9E8E3" class="ink" stroke-width="11"/>
  <text x="512" y="510" text-anchor="middle" font-size="70" fill="#141414">pump</text>
  <text x="512" y="562" text-anchor="middle" font-size="40" letter-spacing="10" fill="#FF2D8A">BOARD</text>

  <!-- rubber pad -->
  <rect x="340" y="622" width="344" height="174" rx="14" fill="#141414"/>
  <g stroke="#E9E8E3" stroke-width="9" stroke-linecap="round">
    <line x1="372" y1="660" x2="652" y2="660"/>
    <line x1="372" y1="697" x2="652" y2="697"/>
    <line x1="372" y1="734" x2="652" y2="734"/>
    <line x1="372" y1="771" x2="652" y2="771"/>
  </g>
</svg>
